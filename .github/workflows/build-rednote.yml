name: Build and Release REDnote Fold Custom

on:
  push:
    branches:
      - main
    tags:
      - "rednote-v*"
    paths:
      - "build_rednote.py"
      - "rednote_signature_compat.py"
      - "rednote_ad_patch.py"
      - "rednote_ad_display_helper.py"
      - "test_build_rednote.py"
      - "test_rednote_signature_compat.py"
      - "test_rednote_ad_patch.py"
      - "tests/**"
      - "requirements.txt"
      - "ks_pkcs12.keystore"
      - "tools/verify_rednote_release.py"
      - "tools/verify_rednote_signature_compat.py"
      - "tools/verify_rednote_process_gate.py"
      - "tools/verify_fold_dex.py"
      - "tools/build_rednote_package_fix.py"
      - "rednote_package_compat.py"
      - "rednote_resource_package.py"
      - "rednote_launcher_icon.py"
      - "rednote_wechat_share_patch.py"
      - "test_rednote_wechat_share_patch.py"
      - "assets/branding/**"
      - ".github/workflows/build-rednote.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this ad-display-patched build as a GitHub Release
        type: boolean
        required: true
        default: true
      tag:
        description: Release tag to create or use
        type: string
        required: true
        default: rednote-v9.48.1-6
      prerelease:
        description: Mark the published GitHub Release as a pre-release
        type: boolean
        required: true
        default: true
      hide_feed_ads:
        description: Hide discovery-feed ad cards
        type: boolean
        required: true
        default: true
      wechat_share_identity:
        description: Declare the official international REDnote package for WeChat shares
        type: boolean
        required: true
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    env:
      HIDE_FEED_ADS: ${{ github.event_name != 'workflow_dispatch' || inputs.hide_feed_ads }}
      WECHAT_SHARE_IDENTITY: ${{ github.event_name != 'workflow_dispatch' || inputs.wechat_share_identity }}
    outputs:
      hide_feed_ads: ${{ steps.build_variant.outputs.hide_feed_ads }}
      wechat_share_identity: ${{ steps.build_variant.outputs.wechat_share_identity }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Record build variant
        id: build_variant
        run: |
          echo "hide_feed_ads=$HIDE_FEED_ADS" >> "$GITHUB_OUTPUT"
          echo "wechat_share_identity=$WECHAT_SHARE_IDENTITY" >> "$GITHUB_OUTPUT"

      - name: Require ads enabled for release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && !inputs.hide_feed_ads }}
        run: |
          echo "Publishing requires the discovery-feed ad patch; turn off publish to build without it." >&2
          exit 1

      - name: Install Android SDK tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" "build-tools;35.0.0" "platforms;android-35"

          BUILD_TOOLS="$SDK_ROOT/build-tools/35.0.0"
          PLATFORM_JAR="$SDK_ROOT/platforms/android-35/android.jar"
          for tool in aapt2 zipalign apksigner d8; do
            test -x "$BUILD_TOOLS/$tool"
          done
          test -f "$PLATFORM_JAR"

          {
            echo "ANDROID_HOME=$SDK_ROOT"
            echo "ANDROID_SDK_ROOT=$SDK_ROOT"
            echo "ANDROID_JAR=$PLATFORM_JAR"
            echo "AAPT2=$BUILD_TOOLS/aapt2"
            echo "ZIPALIGN=$BUILD_TOOLS/zipalign"
            echo "APKSIGNER=$BUILD_TOOLS/apksigner"
            echo "D8=$BUILD_TOOLS/d8"
          } >> "$GITHUB_ENV"
          echo "$BUILD_TOOLS" >> "$GITHUB_PATH"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install WeChat bytecode inspection dependency
        if: ${{ env.WECHAT_SHARE_IDENTITY == 'true' }}
        run: python -m pip install androguard==4.1.3

      - name: Ensure launcher icon packaging tool
        run: |
          if ! command -v convert >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y imagemagick
          fi

      - name: Run Rednote unit tests
        run: python -m unittest -v test_build_rednote test_rednote_signature_compat test_rednote_ad_patch test_rednote_wechat_share_patch

      - name: Download and verify pinned source for a fresh build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p input bins
          XAPK="input/rednote-9.48.1-9481803.xapk"
          APKEDITOR="bins/apkeditor.jar"
          curl --fail --location --retry 3 \
            "https://d.apkpure.net/b/XAPK/com.xingin.xhs?versionCode=9481803&nc=arm64-v8a&sv=21" \
            --output "$XAPK"
          echo "bbc6e888f0084336418ea07e05bda4723d8b01a36879fe054d050deec0a5c8b0  $XAPK" | sha256sum --check --status
          curl --fail --location --retry 3 \
            "https://github.com/REAndroid/APKEditor/releases/download/V1.4.9/APKEditor-1.4.9.jar" \
            --output "$APKEDITOR"
          echo "a9cd40df818845456be6d696de6110c89edf4b0a0580cb83438ed6b25a366e67  $APKEDITOR" | sha256sum --check --status

      - name: Build fresh signed REDnote clone
        env:
          KEYSTORE_PASSWORD: "123456789"
          KEY_PASSWORD: "123456789"
          KEY_ALIAS: jhc
        shell: bash
        run: |
          set -euo pipefail
          args=(
            python build_rednote.py
            --input input/rednote-9.48.1-9481803.xapk
            --sha256 bbc6e888f0084336418ea07e05bda4723d8b01a36879fe054d050deec0a5c8b0
            --source "APKPure XAPK com.xingin.xhs versionCode 9481803"
            --application-id com.kirikira.rednote.fold
            --fold-layout
            --signature-compat
            --keep-original-main-process
            --launcher-icon assets/branding/xiaokshu.png
            --decode-dex classes17.dex
            --decode-dex classes4.dex
            --output output_apks/rednote-fold-custom.apk
            --report output_apks/rednote-fold-build-report.json
            --keystore ks_pkcs12.keystore
            --key-alias jhc
          )
          if [[ "$HIDE_FEED_ADS" == "true" ]]; then
            args+=(--hide-feed-ads --decode-dex classes19.dex)
          fi
          if [[ "$WECHAT_SHARE_IDENTITY" == "true" ]]; then
            args+=(--wechat-share-official-package)
          fi
          "${args[@]}"

      - name: Verify APK, report, package, signer, and 16 KiB alignment
        shell: bash
        run: |
          set -euo pipefail
          APK="output_apks/rednote-fold-custom.apk"
          REPORT="output_apks/rednote-fold-build-report.json"
          apksigner verify --verbose --print-certs "$APK" | tee /tmp/rednote-apksigner.txt
          grep -F "Signer #1 certificate SHA-256 digest: 637c226c67aec0cdbc6f49cd476d5247f999122606286273e16233a913a088b4" /tmp/rednote-apksigner.txt
          zipalign -c -P 16 -v 4 "$APK"
          aapt2 dump badging "$APK" | grep -F "package: name='com.kirikira.rednote.fold' versionCode='9481803' versionName='9.48.1'"
          unzip -Z1 "$APK" | grep -Fx 'META-INF/XINGIN.SF'
          unzip -Z1 "$APK" | grep -Fx 'META-INF/XINGIN.RSA'
          verify_args=(--expect-launcher-icon)
          if [[ "$HIDE_FEED_ADS" == "true" ]]; then
            verify_args+=(--expect-ads)
          else
            verify_args+=(--expect-no-ads)
          fi
          if [[ "$WECHAT_SHARE_IDENTITY" == "true" ]]; then
            verify_args+=(--expect-wechat-share-identity)
          else
            verify_args+=(--expect-no-wechat-share-identity)
          fi
          python tools/verify_rednote_release.py "$APK" "$REPORT" "${verify_args[@]}"

          (
            cd output_apks
            sha256sum rednote-fold-custom.apk rednote-fold-build-report.json > SHA256SUMS
          )
          mkdir -p release-assets
          cp output_apks/rednote-fold-custom.apk output_apks/rednote-fold-build-report.json output_apks/SHA256SUMS release-assets/

      - name: Upload candidate artifact for release
        uses: actions/upload-artifact@v6
        with:
          name: rednote-fold-custom
          path: release-assets/*
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/rednote-v')) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish && inputs.hide_feed_ads)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download candidate artifact
        uses: actions/download-artifact@v6
        with:
          name: rednote-fold-custom
          path: release-assets

      - name: Create release without replacing an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DISPATCH_TAG: ${{ inputs.tag }}
          IS_PRERELEASE: ${{ github.event_name != 'workflow_dispatch' || inputs.prerelease }}
          WECHAT_SHARE_IDENTITY: ${{ needs.build.outputs.wechat_share_identity }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            tag="$DISPATCH_TAG"
          fi
          if [[ ! "$tag" =~ ^rednote-v9\.48\.1-[0-9]+$ ]]; then
            echo "Refusing invalid REDnote release tag: $tag" >&2
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; refusing to replace its assets." >&2
            exit 1
          fi
          (
            cd release-assets
            sha256sum --check SHA256SUMS
          )
          cat > release-notes.md <<'NOTES'
          REDnote 9.48.1 fold build with the 小K书 launcher icon, discovery-feed ad cards hidden, the source main-process name preserved, and the compiled resource-table package name set to `com.kirikira.rednote.fold`.

          The application keeps the source process name `com.xingin.xhs` and the original main-process predicate. Its resource table uses the clone package name `com.kirikira.rednote.fold`; this lets the clone keep its distinct Android package identity while preserving the source process behavior.

          The launcher icon uses the 小K书 branding. The feed ad patch hides ad cards and restores a recycled card's source view state before rebinding. It does not change feed requests or data. The package-compatibility fix preserves the original main-process behavior while keeping the installed package at `com.kirikira.rednote.fold`.

          Android `versionCode` 9481803, `versionName` 9.48.1, package name, and signing certificate remain unchanged. Release tags identify patch revisions.

          No SMS or OTP flow was run for this build. No user phone number or verification code is included in the release assets.

          Signed with `ks_pkcs12.keystore`, alias `jhc`; APK signer SHA-256 is `637c226c67aec0cdbc6f49cd476d5247f999122606286273e16233a913a088b4`.
          NOTES

          if [[ "$WECHAT_SHARE_IDENTITY" == "true" ]]; then
            cat >> release-notes.md <<'NOTES'

          **WeChat sharing:** Only SendMessageToWX requests (command 2) targeting WeChat declare `com.xingin.xhs` instead of the installed clone package. The existing checksum uses that same declared package. Original requests, media and AppID are retained. App registration, token acquisition, actual calling UID, cryptographic APK signer, login/payment requests and callback routing are unchanged.

          **WeChat sharing requires the official international REDnote (Google Play edition, package `com.xingin.xhs`) installed alongside 小K书.** The account owner confirmed successful WeChat sharing with this configuration in release `rednote-v9.48.1-6`. Callbacks may return to the official REDnote app. [Install official international REDnote](https://play.google.com/store/apps/details?id=com.xingin.xhs).

          To return to the stable build, overlay-install [rednote-v9.48.1-5](https://github.com/KiriKira/xhs-apk-custom/releases/download/rednote-v9.48.1-5/rednote-fold-custom.apk). Package, signer and Android versions remain identical; no uninstall or separate rollback VM is required.
          NOTES
          fi

          assets=(
            release-assets/rednote-fold-custom.apk
            release-assets/SHA256SUMS
            release-assets/rednote-fold-build-report.json
          )
          release_flags=(
            --title "$tag" \
            --notes-file release-notes.md \
            --latest=false \
            --target "$GITHUB_SHA"
          )
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$tag" "${assets[@]}" "${release_flags[@]}"
