name: XHS Fold Home Experiment

on:
  push:
    branches: [main]
    paths:
      - "fold_home_experiment.py"
      - ".github/workflows/fold-home-experiment.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Android tools
        run: |
          SDK_ROOT="/usr/local/lib/android/sdk"
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0" "platforms;android-35"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/build-tools/35.0.0" >> "$GITHUB_PATH"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Build fold-home variants
        env:
          BASE_APK_URL: "https://dl.coolapk.com/down?pn=com.xingin.xhs&id=15276&v=MTUyNzY&type=apk&from=market-v13&vc=9334801&nd=0&h=3c30e27f"
        run: python fold_home_experiment.py
      - name: Verify outputs
        run: |
          apksigner verify --verbose --print-certs output_apks/xhs-java-sigspoof-foldhome.apk
          apksigner verify --verbose --print-certs output_apks/xhs-java-sigspoof-foldhome-pad.apk
      - uses: actions/upload-artifact@v6
        with:
          name: xhs-fold-home-experiment
          path: |
            output_apks/xhs-java-sigspoof-foldhome.apk
            output_apks/xhs-java-sigspoof-foldhome-pad.apk
            output_apks/fold-home-experiment-info.txt
          if-no-files-found: error
          retention-days: 7
