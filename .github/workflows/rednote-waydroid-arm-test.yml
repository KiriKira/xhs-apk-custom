name: REDnote native ARM64 Waydroid phone test

on:
  push:
    branches: ["codex/rednote-kvm-test"]
    paths:
      - ".github/workflows/rednote-waydroid-arm-test.yml"
      - "tools/rednote_private_input.py"
      - "tools/rednote_phone_test.py"
      - "tools/rednote_login_preview.py"
      - "tools/rednote_otp_test.py"
      - "build_rednote.py"
      - "ks_pkcs12.keystore"
  workflow_dispatch:
    inputs:
      variant:
        description: Variant to test on native ARM64 Waydroid
        required: true
        type: choice
        options:
          - original
          - control
          - fold
        default: original

permissions:
  contents: read

concurrency:
  group: rednote-waydroid-arm-${{ github.ref }}-${{ inputs.variant || 'original' }}
  cancel-in-progress: true

jobs:
  phone:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: ${{ (inputs.variant == 'control' || inputs.variant == 'fold') && 60 || 40 }}
    permissions:
      contents: write
    env:
      TEST_VARIANT: ${{ inputs.variant || 'original' }}
      TEST_PACKAGE: com.xingin.xhs
      WAYLAND_DISPLAY: wayland-0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install matching Binder module and Waydroid host packages
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          kernel_release="$(uname -r)"
          echo "runner_arch=$(uname -m) kernel=$kernel_release"
          sudo apt-get update -qq
          module_package="linux-modules-extra-$kernel_release"
          module_candidate="$(apt-cache policy "$module_package" | awk '/Candidate:/ { print $2; exit }')"
          if [ -z "$module_candidate" ] || [ "$module_candidate" = "(none)" ]; then
            echo "No exact Binder module package candidate for running kernel $kernel_release"
            exit 1
          fi
          echo "installing exact package $module_package=$module_candidate"
          sudo apt-get install -y --no-install-recommends "$module_package=$module_candidate"
          sudo modprobe binder_linux devices=binder,hwbinder,vndbinder
          test -d /sys/module/binder_linux
          grep -qw binder /proc/filesystems
          binderfs_probe="$RUNNER_TEMP/binderfs-probe"
          sudo mkdir -p "$binderfs_probe"
          sudo mount -t binder binder "$binderfs_probe"
          test -c "$binderfs_probe/binder-control"
          sudo umount "$binderfs_probe"
          sudo rmdir "$binderfs_probe"

          sudo apt-get install -y --no-install-recommends adb apksigner ca-certificates curl dbus-daemon gnupg libpulse0 pulseaudio unzip weston
          curl --fail --location --retry 2 --connect-timeout 20 --max-time 90 https://repo.waydro.id | sudo bash
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends waydroid
          command -v adb
          command -v apksigner
          command -v weston
          command -v waydroid
          java -version
          adb version
          weston --version
          waydroid --version

      - name: Fetch pinned source and build the selected clone before Android startup
        shell: bash
        env:
          KEYSTORE_PASSWORD: "123456789"
          KEY_PASSWORD: "123456789"
        run: |
          set -euo pipefail
          case "$TEST_VARIANT" in
            original|control|fold) ;;
            *) echo "Unsupported test variant: $TEST_VARIANT"; exit 2 ;;
          esac
          mkdir -p rednote-input/original bins output_apks rednote-report
          curl --fail --location --retry 2 --connect-timeout 20 --max-time 240 --speed-time 30 --speed-limit 1024 \
            'https://d.apkpure.net/b/XAPK/com.xingin.xhs?versionCode=9481803&nc=arm64-v8a&sv=21' \
            --output rednote-input/rednote.xapk
          echo 'bbc6e888f0084336418ea07e05bda4723d8b01a36879fe054d050deec0a5c8b0  rednote-input/rednote.xapk' | sha256sum --check

          if [ "$TEST_VARIANT" = original ]; then
            python3 - <<'PYCODE'
          import pathlib, zipfile
          target = pathlib.Path('rednote-input/original')
          with zipfile.ZipFile('rednote-input/rednote.xapk') as archive:
              apks = [entry for entry in archive.infolist() if entry.filename.lower().endswith('.apk')]
              if len(apks) != 3:
                  raise SystemExit('Unexpected split set')
              for entry in apks:
                  target.joinpath(pathlib.PurePosixPath(entry.filename).name).write_bytes(archive.read(entry))
          PYCODE
            for apk in rednote-input/original/*.apk; do
              apksigner verify "$apk" >/dev/null
              echo "verified original split signature: $(basename "$apk")"
            done
          else
            sudo apt-get install -y --no-install-recommends qemu-user
            command -v qemu-x86_64

            curl --fail --location --retry 2 --connect-timeout 20 --max-time 240 --speed-time 30 --speed-limit 1024 \
              'https://dl.google.com/android/repository/build-tools_r35_linux.zip' \
              --output "$RUNNER_TEMP/build-tools_r35_linux.zip"
            echo 'bd3a4966912eb8b30ed0d00b0cda6b6543b949d5ffe00bea54c04c81e1561d88  '"$RUNNER_TEMP"'/build-tools_r35_linux.zip' | sha256sum --check
            echo '2cfaa0bbb2336e9ec18ed3ecea84fa2e2af607bc  '"$RUNNER_TEMP"'/build-tools_r35_linux.zip' | sha1sum --check
            mkdir -p "$RUNNER_TEMP/build-tools-extract" "$RUNNER_TEMP/android-sdk/build-tools"
            unzip -q "$RUNNER_TEMP/build-tools_r35_linux.zip" -d "$RUNNER_TEMP/build-tools-extract"
            mv "$RUNNER_TEMP/build-tools-extract/android-15" "$RUNNER_TEMP/android-sdk/build-tools/35.0.0"
            grep -qx 'Pkg.Revision=35.0.0' "$RUNNER_TEMP/android-sdk/build-tools/35.0.0/source.properties"
            export ANDROID_HOME="$RUNNER_TEMP/android-sdk"

            mkdir -p "$RUNNER_TEMP/amd64-lists/partial" "$RUNNER_TEMP/amd64-debs" "$RUNNER_TEMP/amd64-root"
            cat > "$RUNNER_TEMP/amd64.list" <<'APT'
          deb [arch=amd64] https://archive.ubuntu.com/ubuntu noble main
          deb [arch=amd64] https://archive.ubuntu.com/ubuntu noble-updates main
          deb [arch=amd64] https://security.ubuntu.com/ubuntu noble-security main
          APT
            apt_opts=(
              -o "Dir::Etc::sourcelist=$RUNNER_TEMP/amd64.list"
              -o Dir::Etc::sourceparts=-
              -o "Dir::State::lists=$RUNNER_TEMP/amd64-lists"
              -o APT::Architecture=amd64
              -o APT::Architectures=amd64
            )
            sudo apt-get update -qq "${apt_opts[@]}"
            (cd "$RUNNER_TEMP/amd64-debs" && apt-get download "${apt_opts[@]}" libc6:amd64 libgcc-s1:amd64)
            for deb in "$RUNNER_TEMP"/amd64-debs/*.deb; do
              dpkg-deb -x "$deb" "$RUNNER_TEMP/amd64-root"
            done
            sysroot="$RUNNER_TEMP/amd64-root"
            if [ ! -e "$sysroot/lib/x86_64-linux-gnu" ] && [ -d "$sysroot/usr/lib/x86_64-linux-gnu" ]; then
              mkdir -p "$sysroot/lib"
              ln -s ../usr/lib/x86_64-linux-gnu "$sysroot/lib/x86_64-linux-gnu"
            fi
            if [ -d "$sysroot/usr/lib/x86_64-linux-gnu" ]; then
              mkdir -p "$sysroot/lib/x86_64-linux-gnu"
              for library in ld-linux-x86-64.so.2 libc.so.6 libgcc_s.so.1; do
                if [ ! -e "$sysroot/lib/x86_64-linux-gnu/$library" ] && [ -e "$sysroot/usr/lib/x86_64-linux-gnu/$library" ]; then
                  ln -s "../../usr/lib/x86_64-linux-gnu/$library" "$sysroot/lib/x86_64-linux-gnu/$library"
                fi
              done
            fi
            if [ -L "$sysroot/lib64" ] && [ ! -e "$sysroot/lib64" ]; then rm "$sysroot/lib64"; fi
            mkdir -p "$sysroot/lib64"
            ln -sfn ../lib/x86_64-linux-gnu/ld-linux-x86-64.so.2 "$sysroot/lib64/ld-linux-x86-64.so.2"
            test -e "$sysroot/lib64/ld-linux-x86-64.so.2"
            test -e "$sysroot/lib/x86_64-linux-gnu/libc.so.6"
            test -e "$sysroot/lib/x86_64-linux-gnu/libgcc_s.so.1"

            export QEMU_SYSROOT="$sysroot"
            cat > "$RUNNER_TEMP/aapt2-qemu" <<'WRAPPER'
          #!/bin/sh
          set -eu
          exec qemu-x86_64 -L "$QEMU_SYSROOT" "$ANDROID_HOME/build-tools/35.0.0/aapt2" "$@"
          WRAPPER
            cat > "$RUNNER_TEMP/zipalign-qemu" <<'WRAPPER'
          #!/bin/sh
          set -eu
          exec qemu-x86_64 -L "$QEMU_SYSROOT" "$ANDROID_HOME/build-tools/35.0.0/zipalign" "$@"
          WRAPPER
            chmod +x "$RUNNER_TEMP/aapt2-qemu" "$RUNNER_TEMP/zipalign-qemu"
            export AAPT2="$RUNNER_TEMP/aapt2-qemu"
            export ZIPALIGN="$RUNNER_TEMP/zipalign-qemu"
            export APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
            "$AAPT2" version
            zipalign_help="$("$ZIPALIGN" -h 2>&1 || true)"
            echo "$zipalign_help" | grep -q -- '-P'

            curl --fail --location --retry 2 --connect-timeout 20 --max-time 180 --speed-time 30 --speed-limit 1024 \
              'https://github.com/REAndroid/APKEditor/releases/download/V1.4.9/APKEditor-1.4.9.jar' \
              --output bins/apkeditor.jar
            echo 'a9cd40df818845456be6d696de6110c89edf4b0a0580cb83438ed6b25a366e67  bins/apkeditor.jar' | sha256sum --check
            options=()
            if [ "$TEST_VARIANT" = fold ]; then options+=(--fold-layout); fi
            python3 build_rednote.py \
              --input rednote-input/rednote.xapk \
              --sha256 bbc6e888f0084336418ea07e05bda4723d8b01a36879fe054d050deec0a5c8b0 \
              --source 'https://apkpure.net/rednote-app/com.xingin.xhs/download' \
              --application-id com.kirikira.rednote.fold \
              --output output_apks/phone-test.apk --report "rednote-report/$TEST_VARIANT-build.json" "${options[@]}"
            echo 'TEST_PACKAGE=com.kirikira.rednote.fold' >> "$GITHUB_ENV"
          fi

      - name: Initialize official ARM64 Vanilla image and start headless Waydroid
        shell: bash
        run: |
          set -euo pipefail
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/waydroid-runtime"
          install -d -m 700 "$XDG_RUNTIME_DIR"
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          echo "WAYLAND_DISPLAY=$WAYLAND_DISPLAY" >> "$GITHUB_ENV"
          sudo timeout 900 waydroid init -s VANILLA
          # Official software rendering fallback for hosts without a render node.
          sudo python3 - <<'PYCONFIG'
          import configparser, pathlib
          path = pathlib.Path("/var/lib/waydroid/waydroid.cfg")
          config = configparser.ConfigParser()
          config.read(path)
          if not config.has_section("properties"):
              config.add_section("properties")
          config["properties"]["ro.hardware.gralloc"] = "default"
          config["properties"]["ro.hardware.egl"] = "swiftshader"
          with path.open("w") as stream:
              config.write(stream)
          PYCONFIG
          sudo timeout 120 waydroid upgrade -o
          sudo systemctl enable --now waydroid-container
          systemctl is-active --quiet waydroid-container

          rm -f "$RUNNER_TEMP/waydroid-dbus-address" "$RUNNER_TEMP/waydroid-session-supervisor.log" "$RUNNER_TEMP/weston.log"
          nohup setsid dbus-run-session -- bash -c '
            set -euo pipefail
            echo "$DBUS_SESSION_BUS_ADDRESS" > "$RUNNER_TEMP/waydroid-dbus-address"
            pulseaudio --daemonize=no --exit-idle-time=-1 --log-target="file:$RUNNER_TEMP/pulseaudio.log" &
            pulse_pid=$!
            for attempt in $(seq 1 20); do
              if [ -S "$XDG_RUNTIME_DIR/pulse/native" ]; then break; fi
              if ! kill -0 "$pulse_pid" 2>/dev/null; then
                tail -n 80 "$RUNNER_TEMP/pulseaudio.log" || true
                exit 1
              fi
              sleep 1
            done
            test -S "$XDG_RUNTIME_DIR/pulse/native"
            weston --no-config --backend=headless --renderer=pixman --width=1080 --height=1920 --socket="$WAYLAND_DISPLAY" --log="$RUNNER_TEMP/weston.log" &
            weston_pid=$!
            for attempt in $(seq 1 60); do
              if [ -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ]; then break; fi
              if ! kill -0 "$weston_pid" 2>/dev/null; then
                tail -n 80 "$RUNNER_TEMP/weston.log" || true
                exit 1
              fi
              sleep 1
            done
            test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY"
            if waydroid session start; then
              echo "Waydroid user session terminated before cleanup"
              exit 1
            else
              status=$?
              echo "Waydroid user session failed with exit $status"
              exit "$status"
            fi
          ' > "$RUNNER_TEMP/waydroid-session-supervisor.log" 2>&1 </dev/null &
          supervisor_pid=$!
          echo "$supervisor_pid" > "$RUNNER_TEMP/waydroid-session-supervisor.pid"

          for attempt in $(seq 1 90); do
            if ! kill -0 "$supervisor_pid" 2>/dev/null; then
              tail -n 100 "$RUNNER_TEMP/waydroid-session-supervisor.log" || true
              tail -n 100 "$RUNNER_TEMP/weston.log" || true
              exit 1
            fi
            if [ -s "$RUNNER_TEMP/waydroid-dbus-address" ] && [ -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ]; then break; fi
            sleep 1
          done
          test -s "$RUNNER_TEMP/waydroid-dbus-address"
          export DBUS_SESSION_BUS_ADDRESS="$(cat "$RUNNER_TEMP/waydroid-dbus-address")"
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"
          timeout 10 waydroid status || true

          # This is our fresh VM: trust our own debugging host without disabling
          # Android ADB authentication or changing any app/device identity.
          debug_key="$RUNNER_TEMP/waydroid-host-adbkey"
          adb keygen "$debug_key"
          chmod 600 "$debug_key"
          export ADB_VENDOR_KEYS="$debug_key"
          echo "ADB_VENDOR_KEYS=$ADB_VENDOR_KEYS" >> "$GITHUB_ENV"
          adb start-server
          android_ready=false
          shell_deadline=$((SECONDS + 240))
          while ((SECONDS < shell_deadline)); do
            sudo timeout 5 lxc-unfreeze -P /var/lib/waydroid/lxc -n waydroid >/dev/null 2>&1 || true
            shell_boot="$(sudo timeout 8 waydroid shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            echo "Android shell boot_completed=${shell_boot:-<empty>}"
            if [ "$shell_boot" = 1 ]; then android_ready=true; break; fi
            sleep 3
          done
          test "$android_ready" = true
          nohup setsid waydroid show-full-ui > "$RUNNER_TEMP/waydroid-full-ui.log" 2>&1 </dev/null &
          echo "$!" > "$RUNNER_TEMP/waydroid-full-ui.pid"
          sudo timeout 5 lxc-unfreeze -P /var/lib/waydroid/lxc -n waydroid >/dev/null 2>&1 || true
          sudo timeout 20 waydroid shell -- sh -c '
            set -eu
            mkdir -p /data/misc/adb
            cat > /data/misc/adb/adb_keys
            chown 1000:2000 /data/misc/adb/adb_keys
            chmod 640 /data/misc/adb/adb_keys
            restorecon /data/misc/adb/adb_keys
            test "$(getprop ro.adb.secure)" = 1
            setprop ctl.restart adbd
          ' < "$debug_key.pub"
          echo "Trusted this VM debugging host; ro.adb.secure remains enabled"
          sleep 3

          waydroid_ip=""
          adb_ready=false
          is_ipv4() {
            WAYDROID_IP="${1:-}" python3 - <<'PYIP'
          import ipaddress, os, sys
          try:
              address = ipaddress.ip_address(os.environ.get("WAYDROID_IP", ""))
              if not isinstance(address, ipaddress.IPv4Address):
                  raise ValueError("IPv4 required")
          except ValueError:
              sys.exit(1)
          PYIP
          }
          adb_deadline=$((SECONDS + 180))
          attempt=0
          while ((SECONDS < adb_deadline)); do
            attempt=$((attempt + 1))
            if ! kill -0 "$supervisor_pid" 2>/dev/null; then break; fi
            sudo timeout 5 lxc-unfreeze -P /var/lib/waydroid/lxc -n waydroid >/dev/null 2>&1 || true
            status_output="$(timeout 10 waydroid status 2>/dev/null || true)"
            echo "Waydroid status poll $attempt:"
            echo "$status_output"
            waydroid_ip="$(echo "$status_output" | awk -F: '/IP address:/ { gsub(/^[[:space:]]+/, "", $2); print $2; exit }')"
            if ! is_ipv4 "$waydroid_ip"; then
              echo "Waydroid status did not expose IPv4; checking the LXC lease address"
              for lxc_ip in $(sudo timeout 8 lxc-info -P /var/lib/waydroid/lxc -n waydroid -iH 2>/dev/null || true); do
                if is_ipv4 "$lxc_ip"; then waydroid_ip="$lxc_ip"; break; fi
              done
            fi
            if is_ipv4 "$waydroid_ip"; then
              test_serial="$waydroid_ip:5555"
              echo "Waydroid container IPv4 address: $waydroid_ip"
              timeout 3 adb disconnect "$test_serial" || true
              timeout 8 adb connect "$test_serial" || true
              timeout 5 adb devices -l || true
              device_state="$(timeout 5 adb -s "$test_serial" get-state 2>&1 || true)"
              echo "ADB device state: ${device_state:-<empty>}"
              if [ "$device_state" = device ]; then adb_ready=true; break; fi
            fi
            sleep 2
          done
          if [ "$adb_ready" != true ]; then
            echo "Waydroid did not report a valid IPv4 address and connected ADB device"
            waydroid status || true
            exit 1
          fi

          test_serial="$waydroid_ip:5555"
          echo "TEST_SERIAL=$test_serial" >> "$GITHUB_ENV"
          echo "Waydroid serial ready: $test_serial"
          booted=""
          boot_deadline=$((SECONDS + 300))
          attempt=0
          while ((SECONDS < boot_deadline)); do
            attempt=$((attempt + 1))
            booted="$(timeout 5 adb -s "$test_serial" shell getprop sys.boot_completed | tr -d '\r' || true)"
            echo "Android boot poll $attempt sys.boot_completed=${booted:-<empty>}"
            if [ "$booted" = 1 ]; then break; fi
            sleep 5
          done
          test "$booted" = 1
          abi_list="$(adb -s "$test_serial" shell getprop ro.product.cpu.abilist | tr -d '\r')"
          android_api="$(adb -s "$test_serial" shell getprop ro.build.version.sdk | tr -d '\r')"
          echo "android_api=$android_api abilist=$abi_list"
          case ",$abi_list," in
            *,arm64-v8a,*) ;;
            *) echo "ARM64 Android ABI is not available"; exit 1 ;;
          esac
          test "$android_api" -ge 33
          adb -s "$test_serial" shell service check package
          adb -s "$test_serial" shell service check activity
          # Prepare the fresh test desktop before opening any app/account flow.
          adb -s "$test_serial" shell wm size 1080x1920
          adb -s "$test_serial" shell wm density 420
          adb -s "$test_serial" shell settings put system screen_off_timeout 1800000
          adb -s "$test_serial" shell input keyevent KEYCODE_WAKEUP
          adb -s "$test_serial" shell wm dismiss-keyguard
          adb -s "$test_serial" shell input keyevent KEYCODE_HOME
          adb -s "$test_serial" shell cmd statusbar collapse
          # Permit this VM's normal forwarding through the Docker host firewall.
          sudo iptables -I FORWARD 1 -i waydroid0 -j ACCEPT
          sudo iptables -I FORWARD 1 -o waydroid0 -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT
          adb -s "$test_serial" shell ip route
          adb -s "$test_serial" push tools/rednote-network-probe.jar /data/local/tmp/rednote-network-probe.jar
          timeout 90 adb -s "$test_serial" shell env CLASSPATH=/data/local/tmp/rednote-network-probe.jar app_process /system/bin RednoteNetworkProbe

      - name: Install the selected original or rebuilt APK
        shell: bash
        run: |
          set -euo pipefail
          if [ "$TEST_VARIANT" = original ]; then
            adb -s "$TEST_SERIAL" install-multiple rednote-input/original/*.apk
          else
            adb -s "$TEST_SERIAL" install output_apks/phone-test.apk
          fi

      - name: Publish a preview before entering any account information
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 tools/rednote_login_preview.py --serial "$TEST_SERIAL" \
            --package "$TEST_PACKAGE" --output "$RUNNER_TEMP/rednote-preview.json"
          python3 - <<'PYCODE'
          import base64, json, os, pathlib, sys
          sys.path.insert(0, 'tools')
          from rednote_private_input import api
          rid = os.environ['GITHUB_RUN_ID']
          preview = json.loads(pathlib.Path(os.environ['RUNNER_TEMP'], 'rednote-preview.json').read_text())
          ready = preview.get('phone_form_visible') is True and bool(preview.get('app_pid')) and preview.get('result_category') in ('phone_login_form', 'phone_country_code_visible')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f"PREVIEW_READY={'true' if ready else 'false'}\n")
          if not ready:
              limited = {'stage': 'startup_not_ready', 'test_variant': os.environ['TEST_VARIANT'],
                         'result_category': preview.get('result_category'), 'phone_input_performed': False,
                         'sms_requested': False, 'app_pid': preview.get('app_pid'),
                         'matched_prompt_keywords': preview.get('matched_prompt_keywords', []),
                         'runtime_diagnostics': preview.get('runtime_diagnostics', {})}
              pathlib.Path('phone-result.json').write_text(json.dumps(limited, ensure_ascii=False))
          api('PUT', f'runtime-control/rednote-{rid}.preview.json', {
              'message': f'Add account-free login preview for run {rid}',
              'branch': os.environ['GITHUB_REF_NAME'],
              'content': base64.b64encode(pathlib.Path(os.environ['RUNNER_TEMP'], 'rednote-preview.json').read_bytes()).decode('ascii')
          })
          PYCODE

      - name: Receive a single encrypted phone input for this runner
        if: env.PREVIEW_READY == 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 tools/rednote_private_input.py generate
          python3 tools/rednote_private_input.py wait --timeout 600

      - name: Test the selected variant's phone flow once
        if: env.PREVIEW_READY == 'true'
        shell: bash
        run: |
          set -euo pipefail
          touch phone-phase-started
          python3 tools/rednote_phone_test.py \
            --serial "$TEST_SERIAL" --package "$TEST_PACKAGE" \
            --payload-file "$RUNNER_TEMP/rednote-$GITHUB_RUN_ID.phone.json" \
            --report-file phone-result.json
          rm -f "$RUNNER_TEMP/rednote-$GITHUB_RUN_ID.phone.json"

      - name: Publish the phone result and determine whether a user code is needed
        if: env.PREVIEW_READY == 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYCODE'
          import base64, json, os, pathlib, sys
          sys.path.insert(0, 'tools')
          from rednote_private_input import api
          report = json.loads(pathlib.Path('phone-result.json').read_text())
          need_otp = report['result_category'] == 'otp_screen' and report['steps']['get_code_clicked']
          report['stage'] = 'waiting_otp' if need_otp else 'phone_finished'
          report['test_variant'] = os.environ['TEST_VARIANT']
          pathlib.Path('phone-result.json').write_text(json.dumps(report, ensure_ascii=False))
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f"NEED_OTP={'true' if need_otp else 'false'}\n")
          api('PUT', f"runtime-control/rednote-{os.environ['GITHUB_RUN_ID']}.result.json", {
              'message': 'Record the limited phone-test result',
              'branch': os.environ['GITHUB_REF_NAME'],
              'content': base64.b64encode(pathlib.Path('phone-result.json').read_bytes()).decode('ascii')
          })
          PYCODE

      - name: Receive a user-supplied code for the same session
        if: env.NEED_OTP == 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 tools/rednote_private_input.py generate --kind otp
          python3 tools/rednote_private_input.py wait --kind otp --timeout 600

      - name: Verify the user-supplied code once
        if: env.NEED_OTP == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/rednote_otp_test.py \
            --serial "$TEST_SERIAL" --package "$TEST_PACKAGE" \
            --payload-file "$RUNNER_TEMP/rednote-$GITHUB_RUN_ID-otp.otp.json" \
            --report-file otp-result.json
          rm -f "$RUNNER_TEMP/rednote-$GITHUB_RUN_ID-otp.otp.json"

      - name: Publish the limited result and clean up
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          stop_waydroid_runtime() {
            if [ -s "$RUNNER_TEMP/waydroid-full-ui.pid" ]; then
              ui_pid="$(cat "$RUNNER_TEMP/waydroid-full-ui.pid")"
              kill -TERM -- "-$ui_pid" 2>/dev/null || kill -TERM "$ui_pid" 2>/dev/null || true
            fi
            if [ -s "$RUNNER_TEMP/waydroid-session-supervisor.pid" ]; then
              supervisor_pid="$(cat "$RUNNER_TEMP/waydroid-session-supervisor.pid")"
              kill -TERM -- "-$supervisor_pid" 2>/dev/null || kill -TERM "$supervisor_pid" 2>/dev/null || true
            fi
            sudo systemctl stop waydroid-container >/dev/null 2>&1 || true
          }
          cleanup() {
            rm -f "$RUNNER_TEMP/waydroid-host-adbkey" "$RUNNER_TEMP/waydroid-host-adbkey.pub"
            rm -f "$RUNNER_TEMP/rednote-$GITHUB_RUN_ID.key.pem" "$RUNNER_TEMP/rednote-$GITHUB_RUN_ID.state.json" "$RUNNER_TEMP/rednote-$GITHUB_RUN_ID.phone.json"
            rm -f "$RUNNER_TEMP/rednote-$GITHUB_RUN_ID-otp.key.pem" "$RUNNER_TEMP/rednote-$GITHUB_RUN_ID-otp.state.json" "$RUNNER_TEMP/rednote-$GITHUB_RUN_ID-otp.otp.json"
            stop_waydroid_runtime
          }
          trap cleanup EXIT
          python3 - <<'PYCODE'
          import base64, json, os, pathlib, sys
          sys.path.insert(0, 'tools')
          from rednote_private_input import api
          report = pathlib.Path('phone-result.json')
          if report.is_file():
              data = json.loads(report.read_text())
              otp = pathlib.Path('otp-result.json')
              if otp.is_file():
                  data['otp'] = json.loads(otp.read_text())
                  data['stage'] = 'complete'
              elif os.environ.get('NEED_OTP') == 'true':
                  data['stage'] = 'otp_not_completed'
              path = f"runtime-control/rednote-{os.environ['GITHUB_RUN_ID']}.result.json"
              old = api('GET', path)
              body = {
                  'message': 'Record limited REDnote phone-test result',
                  'branch': os.environ['GITHUB_REF_NAME'],
                  'content': base64.b64encode(json.dumps(data, ensure_ascii=False).encode()).decode('ascii')
              }
              if old:
                  body['sha'] = old['sha']
              api('PUT', path, body)
              print(json.dumps(data, ensure_ascii=False))
          for infix, suffixes in (('', ('key.pem', 'state.json', 'phone.json')), ('-otp', ('key.pem', 'state.json', 'otp.json'))):
              for suffix in suffixes:
                  pathlib.Path(os.environ['RUNNER_TEMP'], f"rednote-{os.environ['GITHUB_RUN_ID']}{infix}.{suffix}").unlink(missing_ok=True)
          PYCODE
          if [ ! -f phone-phase-started ]; then
            tail -n 80 "$RUNNER_TEMP/waydroid-session-supervisor.log" 2>/dev/null || true
            tail -n 80 "$RUNNER_TEMP/waydroid-full-ui.log" 2>/dev/null || true
            tail -n 80 "$RUNNER_TEMP/weston.log" 2>/dev/null || true
            tail -n 80 "$RUNNER_TEMP/pulseaudio.log" 2>/dev/null || true
            sudo timeout 20 waydroid shell getprop sys.boot_completed 2>/dev/null || true
            sudo timeout 20 waydroid shell service check activity 2>/dev/null || true
            sudo timeout 20 waydroid shell -- logcat -d -b crash -t 120 2>/dev/null || true
            sudo tail -n 240 /var/lib/waydroid/waydroid.log 2>/dev/null || true
            sudo journalctl --no-pager -u waydroid-container -n 100 2>/dev/null || true
            sudo lxc-info -P /var/lib/waydroid/lxc -n waydroid 2>/dev/null || true
          fi
          stop_waydroid_runtime
