name: Build XHS Experimental APK

on:
  workflow_dispatch:
    inputs:
      base_apk_url:
        description: "Direct URL for the original Xiaohongshu APK"
        required: true
        default: "https://dl.coolapk.com/down?pn=com.xingin.xhs&id=15276&v=MTUyNzY&type=apk&from=market-v13&vc=9334801&nd=0&h=3c30e27f"
        type: string
      patch_video_layout:
        description: "Also force the experimental Pad/new-video layout gates"
        required: true
        default: false
        type: boolean
      run_diagnostics:
        description: "Print signature/integrity search diagnostics"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android build tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="/usr/local/lib/android/sdk"
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Show persistent test signer
        run: keytool -list -v -keystore ks_pkcs12.keystore -storepass 123456789 -alias jhc

      - name: Build experimental APKs
        env:
          BASE_APK_URL: ${{ inputs.base_apk_url }}
          XHS_PATCH_VIDEO: ${{ inputs.patch_video_layout }}
          SIGNING_KEYSTORE_PATH: ks_pkcs12.keystore
          KEYSTORE_PASSWORD: "123456789"
          KEY_ALIAS: "jhc"
          KEY_PASSWORD: "123456789"
          GITHUB_TOKEN: ${{ github.token }}
        run: python xhs_build_ci.py

      - name: Signature / integrity diagnostics
        if: ${{ inputs.run_diagnostics }}
        shell: bash
        run: |
          set +e
          BASE=".base_apk_xhs/xhs-base.apk"
          echo "===== ORIGINAL SIGNER ====="
          apksigner verify --verbose --print-certs "$BASE"
          echo "===== JAVA SIGNATURE / PACKAGE MANAGER REFERENCES ====="
          grep -R -n -E 'GET_SIGNATURES|GET_SIGNING_CERTIFICATES|getPackageInfo\(|getPackageManager\(|getApkContentsSigners|hasSigningCertificate|SigningInfo;|Signature;|signatures:|signature' xhs_decoded/smali 2>/dev/null | head -n 500
          echo "===== INTEGRITY / ANTI-TAMPER STRINGS ====="
          grep -R -n -E 'integrity|tamper|verify.*sign|sign.*verify|certificate|cert_sha|sha256|sha-256|installer|com\.android\.vending|Play Integrity|pairip' xhs_decoded/smali 2>/dev/null | head -n 500
          echo "===== NATIVE LIB CANDIDATES ====="
          find xhs_decoded -type f -name '*.so' -print | head -n 200

      - name: Verify output signers
        shell: bash
        run: |
          apksigner verify --verbose --print-certs output_apks/xhs-fold8-custom-minimal.apk
          apksigner verify --verbose --print-certs output_apks/xhs-resigned-control.apk

      - name: Upload experimental APKs
        uses: actions/upload-artifact@v6
        with:
          name: xhs-experimental-apks
          path: |
            output_apks/xhs-fold8-custom-minimal.apk
            output_apks/xhs-resigned-control.apk
          if-no-files-found: error
          retention-days: 7
