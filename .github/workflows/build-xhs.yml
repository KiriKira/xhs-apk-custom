name: Build XHS Fold8 Custom

on:
  push:
    branches:
      - main
    paths:
      - "build_xhs.py"
      - "signature_spoof_experiment.py"
      - "xhs_build_ci.py"
      - "download_bins.py"
      - "requirements.txt"
      - ".github/workflows/build-xhs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="/usr/local/lib/android/sdk"
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"             "build-tools;35.0.0"             "platforms;android-35"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Build APK
        env:
          BASE_APK_URL: "https://dl.coolapk.com/down?pn=com.xingin.xhs&id=15276&v=MTUyNzY&type=apk&from=market-v13&vc=9334801&nd=0&h=3c30e27f"
          SIGNING_KEYSTORE_PATH: ks_pkcs12.keystore
          KEYSTORE_PASSWORD: "123456789"
          KEY_ALIAS: "jhc"
          KEY_PASSWORD: "123456789"
          GITHUB_TOKEN: ${{ github.token }}
        run: python build_xhs.py

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          apksigner verify --verbose --print-certs output_apks/xhs-fold8-custom.apk
          unzip -l output_apks/xhs-fold8-custom.apk 'META-INF/*' |             grep -E 'META-INF/XINGIN\.(SF|RSA)' >/dev/null

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: xhs-fold8-custom
          path: output_apks/xhs-fold8-custom.apk
          if-no-files-found: error
          retention-days: 7
