name: Migrate XHS Signing Key

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/migrate-signing-key.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Copy persistent signing key from old XHS branch
        shell: bash
        run: |
          set -euo pipefail
          git remote add old-xhs https://github.com/KiriKira/twitter-apk-custom.git
          git fetch --depth=1 old-xhs xhs-foldable-patch
          git show FETCH_HEAD:ks_pkcs12.keystore > ks_pkcs12.keystore
          echo "Migrated key SHA-256:"
          sha256sum ks_pkcs12.keystore

      - name: Commit migrated key
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ks_pkcs12.keystore
          if git diff --cached --quiet; then
            echo "Signing key already matches."
            exit 0
          fi
          git commit -m "Migrate persistent XHS signing key"
          git push origin HEAD:main
